services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cui_assistant_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cui_assistant_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend